[project]
name = "truthfolio-backend"
version = "0.1.0"
description = "Truthfolio — evidence-backed, honest mutual-fund verdicts (FastAPI + LangGraph)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "numpy>=2.1.0",
    "pandas>=2.2.0",
    "rapidfuzz>=3.10.0",
    "python-dotenv>=1.0.1",
    "langgraph>=0.2.40",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.2.0",
    "langchain-groq>=0.2.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
